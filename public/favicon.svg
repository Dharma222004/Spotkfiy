<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#05c46b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8ff78"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Spotkify Stylized "S" Wave Icon -->
  <path d="M42 20C42 14.5 35.5 12 28.5 12C19.5 12 16 16.5 16 22.5C16 32 38 29 38 38C38 43 33.5 45.5 26.5 45.5C18.5 45.5 15 41 14 37" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Frequency Equalizer Bars Forming the "K" Accents -->
  <path d="M43 27L51 19" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M43 35L51 43" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="27" cy="28.5" r="2.5" fill="#ffffff"/>
</svg>
